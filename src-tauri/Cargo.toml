[package]
name = "super-agent-party"
version = "0.1.0"
libname = "super_agent_party_lib"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
strip = true
